services:
  node: 
    image: node:24
    network_mode: host
    # Wait until InfluxDB answers: after a reboot, Docker restarts both
    # containers at once (depends_on is not applied), so node would otherwise
    # hit ECONNREFUSED on 127.0.0.1:8086 and lose its first writes.
    command:
      - sh
      - -c
      - |
        until node -e "fetch('http://127.0.0.1:8086/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; do
          echo 'Waiting for InfluxDB...'
          sleep 2
        done
        exec node main.js
    restart: always
    working_dir: /app
    init: true
    volumes:
      - ./:/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - TZ=Europe/Paris
      - PORT=8889
  influxdb:
    image: influxdb:2.6-alpine
    network_mode: host
    restart: always
    environment: 
      - TZ=Europe/Paris
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=home
      - DOCKER_INFLUXDB_INIT_PASSWORD=0dBdJpACMCW2CwCRLu0iRyEz7U64P
      - DOCKER_INFLUXDB_INIT_ORG=solar_panel_org
      - DOCKER_INFLUXDB_INIT_BUCKET=solar_panel
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=joWbkcAOqD8hPtRRyEz7U64PLqOrPO
    volumes:
      - data:/var/lib/influxdb2
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      
volumes:
  data:
