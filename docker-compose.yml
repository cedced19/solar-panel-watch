services:
  node: 
    image: node:24
    network_mode: host
    # Wait until VictoriaMetrics answers: after a reboot, Docker restarts both
    # containers at once (depends_on is not applied), so node would otherwise
    # hit ECONNREFUSED on 127.0.0.1:8428 and lose its first writes.
    command:
      - sh
      - -c
      - |
        until node -e "fetch('http://127.0.0.1:8428/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; do
          echo 'Waiting for VictoriaMetrics...'
          sleep 2
        done
        exec node main.js
    restart: always
    # Hard memory ceiling (memswap_limit equal to mem_limit also forbids swap):
    # a spike kills and restarts only this container, not the whole device.
    mem_limit: 250m
    memswap_limit: 250m
    working_dir: /app
    init: true
    volumes:
      - ./:/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      # V8 collects garbage harder before the 250m container ceiling is reached.
      # The semi-space cap matters: with the old-space cap alone, V8's total heap
      # limit is still 352 MB, above the container ceiling; with it, 172 MB.
      - NODE_OPTIONS=--max-old-space-size=160 --max-semi-space-size=4
      - TZ=Europe/Paris
      - PORT=8889
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    network_mode: host
    restart: always
    mem_limit: 250m
    memswap_limit: 250m
    command:
      # Reachable from this machine only (node shares the host network): the
      # API has no authentication.
      - -httpListenAddr=127.0.0.1:8428
      - -storageDataPath=/victoria-metrics-data
      # Keep every reading (the default retention is one month).
      - -retentionPeriod=100y
      # Readings of a series stamped with the same millisecond count once, as
      # InfluxDB kept one point per timestamp.
      - -dedup.minScrapeInterval=1ms
      # A long graph at a fine window (30 days per minute) exceeds the default
      # of 30000 points per series.
      - -search.maxPointsPerTimeseries=1000000
    environment:
      # Soft limit for the Go runtime, below the 250m container ceiling, so it
      # collects garbage aggressively instead of being OOM-killed.
      - GOMEMLIMIT=200MiB
    volumes:
      - victoria-data:/victoria-metrics-data
      
volumes:
  victoria-data:
