services:
  node: 
    image: node:24
    network_mode: service:victoriametrics
    depends_on:
      - victoriametrics
    command: node main.js
    restart: always
    working_dir: /app
    init: true
    volumes:
      - ./:/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Paris
      - PORT=8889
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=100y
      - -dedup.minScrapeInterval=1ms
      - -search.maxPointsPerTimeseries=1000000
    volumes:
      - victoria-data:/victoria-metrics-data
    ports:
      - "8889:8889"
      
volumes:
  victoria-data:
