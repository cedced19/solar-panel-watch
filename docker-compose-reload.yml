services:
  node: 
    image: node:24
    network_mode: host
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    working_dir: /app
    init: true
    volumes:
      - ./:/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Paris
      - PORT=8889
      - NODE_ENV=development
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    network_mode: host
    restart: always
    command:
      # Reachable from this machine only (node shares the host network): the
      # API has no authentication.
      - -httpListenAddr=127.0.0.1:8428
      - -storageDataPath=/victoria-metrics-data
      # Keep every reading (the default retention is one month).
      - -retentionPeriod=100y
      # Readings of a series stamped with the same millisecond count once, as
      # InfluxDB kept one point per timestamp.
      - -dedup.minScrapeInterval=1ms
      # A long graph at a fine window (30 days per minute) exceeds the default
      # of 30000 points per series.
      - -search.maxPointsPerTimeseries=1000000
    environment:
      # Soft limit for the Go runtime, below the 250m container ceiling, so it
      # collects garbage aggressively instead of being OOM-killed.
      - GOMEMLIMIT=200MiB
    volumes:
      - victoria-data:/victoria-metrics-data
      
volumes:
  victoria-data:
